name: Bump Label
on:
  pull_request:
    types: [opened, labeled, unlabeled, synchronize]
jobs:
  check-bump-label:
    runs-on: ubuntu-latest
    steps:
      - uses: mheap/github-action-required-labels@v2
        with:
          mode: exactly
          count: 1
          labels: "bump:patch, bump:minor, bump:major"